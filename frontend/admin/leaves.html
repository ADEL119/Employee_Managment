<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Congés - Admin | GRH System</title>
    <meta name="description" content="Consulter et gérer les demandes de congé des employés.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>

<body>
    <div class="bg-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>
    <div class="sidebar-overlay"></div>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="bi bi-people-fill"></i></div>
            <div>
                <div class="brand-text">GRH System</div>
                <div class="brand-sub">Administration</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Principal</div>
            <a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2-fill"></i><span>Tableau de
                    bord</span></a>
            <a href="employees.html" class="nav-link"><i class="bi bi-people"></i><span>Employés</span></a>
            <div class="nav-section-title">Gestion</div>
            <a href="leaves.html" class="nav-link active"><i class="bi bi-calendar-check"></i><span>Congés</span></a>
            <a href="work-hours.html" class="nav-link"><i class="bi bi-clock-history"></i><span>Heures de
                    travail</span></a>
            <a href="reports.html" class="nav-link"><i class="bi bi-bar-chart-line"></i><span>Rapports</span></a>
        </nav>
        <div class="sidebar-user">
            <div class="user-avatar">AD</div>
            <div class="user-info">
                <div class="user-name">Admin</div>
                <div class="user-role">Administrateur</div>
            </div>
            <button onclick="logout()" class="btn btn-link text-muted p-0 ms-auto" title="Déconnexion"><i
                    class="bi bi-box-arrow-right"></i></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-navbar">
            <div class="d-flex align-items-center gap-3">
                <button class="sidebar-toggle"><i class="bi bi-list"></i></button>
                <h1 class="page-title">Gestion des <span>Congés</span></h1>
            </div>
            <div class="navbar-actions">
                <button class="btn-icon" title="Notifications"><i class="bi bi-bell"></i><span
                        class="badge-dot"></span></button>
            </div>
        </div>

        <div class="page-content">
            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="glass-card stat-card slide-up">
                        <div class="stat-icon warning"><i class="bi bi-hourglass-split"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">En attente</div>
                            <div class="stat-value" id="statPend">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card stat-card slide-up" style="animation-delay:0.1s">
                        <div class="stat-icon success"><i class="bi bi-check-circle"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">Approuvés</div>
                            <div class="stat-value" id="statAppr">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card stat-card slide-up" style="animation-delay:0.15s">
                        <div class="stat-icon danger"><i class="bi bi-x-circle"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">Refusés</div>
                            <div class="stat-value" id="statRej">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter -->
            <div class="glass-card data-table-wrapper slide-up" style="animation-delay:0.2s">
                <div class="filter-bar">
                    <select id="filterStatus" onchange="renderLeaves()">
                        <option value="">Tous les statuts</option>
                        <option value="pending">En attente</option>
                        <option value="approved">Approuvés</option>
                        <option value="rejected">Refusés</option>
                    </select>
                    <select id="filterType" onchange="renderLeaves()">
                        <option value="">Tous les types</option>
                        <option value="Annuel">Annuel</option>
                        <option value="Maladie">Maladie</option>
                        <option value="Personnel">Personnel</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table-dark-custom">
                        <thead>
                            <tr>
                                <th>Employé</th>
                                <th>Type</th>
                                <th>Date début</th>
                                <th>Date fin</th>
                                <th>Jours</th>
                                <th>Raison</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="leavesTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const user = requireAuth('admin');

        function updateStats() {
            document.getElementById('statPend').textContent = DemoData.leaves.filter(l => l.status === 'pending').length;
            document.getElementById('statAppr').textContent = DemoData.leaves.filter(l => l.status === 'approved').length;
            document.getElementById('statRej').textContent = DemoData.leaves.filter(l => l.status === 'rejected').length;
        }

        function renderLeaves() {
            const statusFilter = document.getElementById('filterStatus').value;
            const typeFilter = document.getElementById('filterType').value;
            let data = DemoData.leaves;
            if (statusFilter) data = data.filter(l => l.status === statusFilter);
            if (typeFilter) data = data.filter(l => l.type === typeFilter);

            document.getElementById('leavesTable').innerHTML = data.map(l => `
        <tr>
          <td>
            <div class="employee-cell">
              <div class="emp-avatar">${getInitials(l.employeeName)}</div>
              <div><div class="emp-name">${l.employeeName}</div></div>
            </div>
          </td>
          <td>${l.type}</td>
          <td>${formatDate(l.startDate)}</td>
          <td>${formatDate(l.endDate)}</td>
          <td>${l.days}</td>
          <td><span style="font-size:0.85rem;">${l.reason}</span></td>
          <td>${getStatusBadge(l.status)}</td>
          <td>
            <div class="action-btns">
              ${l.status === 'pending' ? `
                <button class="btn-action success" title="Approuver" onclick="updateLeave(${l.id},'approved')"><i class="bi bi-check-lg"></i></button>
                <button class="btn-action danger" title="Refuser" onclick="updateLeave(${l.id},'rejected')"><i class="bi bi-x-lg"></i></button>
              ` : '<span class="text-muted" style="font-size:0.78rem;">—</span>'}
            </div>
          </td>
        </tr>
      `).join('');
        }

        function updateLeave(id, status) {
            const leave = DemoData.leaves.find(l => l.id === id);
            if (leave) {
                leave.status = status;
                showToast(status === 'approved' ? 'Congé approuvé !' : 'Congé refusé.', status === 'approved' ? 'success' : 'warning');
                renderLeaves();
                updateStats();
            }
        }

        updateStats();
        renderLeaves();
    </script>
</body>

</html>
