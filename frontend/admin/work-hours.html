<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heures de Travail - Admin | GRH System</title>
    <meta name="description" content="Suivi des heures d'entrée et de sortie des employés.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>

<body>
    <div class="bg-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>
    <div class="sidebar-overlay"></div>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="bi bi-people-fill"></i></div>
            <div>
                <div class="brand-text">GRH System</div>
                <div class="brand-sub">Administration</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Principal</div>
            <a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2-fill"></i><span>Tableau de
                    bord</span></a>
            <a href="employees.html" class="nav-link"><i class="bi bi-people"></i><span>Employés</span></a>
            <div class="nav-section-title">Gestion</div>
            <a href="leaves.html" class="nav-link"><i class="bi bi-calendar-check"></i><span>Congés</span></a>
            <a href="work-hours.html" class="nav-link active"><i class="bi bi-clock-history"></i><span>Heures de
                    travail</span></a>
            <a href="reports.html" class="nav-link"><i class="bi bi-bar-chart-line"></i><span>Rapports</span></a>
        </nav>
        <div class="sidebar-user">
            <div class="user-avatar">AD</div>
            <div class="user-info">
                <div class="user-name">Admin</div>
                <div class="user-role">Administrateur</div>
            </div>
            <button onclick="logout()" class="btn btn-link text-muted p-0 ms-auto" title="Déconnexion"><i
                    class="bi bi-box-arrow-right"></i></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-navbar">
            <div class="d-flex align-items-center gap-3">
                <button class="sidebar-toggle"><i class="bi bi-list"></i></button>
                <h1 class="page-title">Heures de <span>Travail</span></h1>
            </div>
            <div class="navbar-actions">
                <button class="btn-icon" title="Notifications"><i class="bi bi-bell"></i></button>
            </div>
        </div>

        <div class="page-content">
            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-3 col-sm-6">
                    <div class="glass-card stat-card slide-up">
                        <div class="stat-icon primary"><i class="bi bi-people-fill"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">Présents</div>
                            <div class="stat-value" id="statPresent">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="glass-card stat-card slide-up" style="animation-delay:0.1s">
                        <div class="stat-icon success"><i class="bi bi-clock-fill"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">Heures Aujourd'hui</div>
                            <div class="stat-value" id="statTodayH">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="glass-card stat-card slide-up" style="animation-delay:0.15s">
                        <div class="stat-icon warning"><i class="bi bi-hourglass-split"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">En cours</div>
                            <div class="stat-value" id="statInProg">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="glass-card stat-card slide-up" style="animation-delay:0.2s">
                        <div class="stat-icon info"><i class="bi bi-calculator"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">Moyenne / jour</div>
                            <div class="stat-value" id="statAvg">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter + Table -->
            <div class="glass-card data-table-wrapper slide-up" style="animation-delay:0.25s">
                <div class="filter-bar">
                    <input type="date" id="filterDate" value="2026-02-14" onchange="renderHours()">
                    <select id="filterEmp" onchange="renderHours()">
                        <option value="">Tous les employés</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table-dark-custom">
                        <thead>
                            <tr>
                                <th>Employé</th>
                                <th>Date</th>
                                <th>Heure d'entrée</th>
                                <th>Heure de sortie</th>
                                <th>Heures travaillées</th>
                                <th>Statut</th>
                            </tr>
                        </thead>
                        <tbody id="hoursTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const user = requireAuth('admin');

        // Populate employee filter
        const empSelect = document.getElementById('filterEmp');
        DemoData.employees.forEach(e => {
            const opt = document.createElement('option');
            opt.value = e.id;
            opt.textContent = e.name;
            empSelect.appendChild(opt);
        });

        function renderHours() {
            const dateFilter = document.getElementById('filterDate').value;
            const empFilter = document.getElementById('filterEmp').value;
            let data = DemoData.workHours;
            if (dateFilter) data = data.filter(w => w.date === dateFilter);
            if (empFilter) data = data.filter(w => w.employeeId === parseInt(empFilter));

            // Stats
            const todayData = DemoData.workHours.filter(w => w.date === '2026-02-14');
            document.getElementById('statPresent').textContent = todayData.length;
            document.getElementById('statTodayH').textContent = todayData.reduce((s, w) => s + (w.hours || 0), 0).toFixed(1);
            document.getElementById('statInProg').textContent = todayData.filter(w => w.status === 'in-progress').length;
            const completed = todayData.filter(w => w.hours);
            document.getElementById('statAvg').textContent = completed.length ? (completed.reduce((s, w) => s + w.hours, 0) / completed.length).toFixed(1) : '0';

            document.getElementById('hoursTable').innerHTML = data.map(w => `
        <tr>
          <td>
            <div class="employee-cell">
              <div class="emp-avatar">${getInitials(w.employeeName)}</div>
              <div class="emp-name">${w.employeeName}</div>
            </div>
          </td>
          <td>${formatDate(w.date)}</td>
          <td><span style="color:var(--success-light);font-weight:600;">${w.clockIn}</span></td>
          <td>${w.clockOut ? `<span style="color:var(--danger-light);font-weight:600;">${w.clockOut}</span>` : '<span class="text-muted">—</span>'}</td>
          <td>${w.hours ? `<span class="fw-bold">${w.hours}h</span>` : '<span class="text-muted">En cours</span>'}</td>
          <td>${getStatusBadge(w.status)}</td>
        </tr>
      `).join('');
        }

        renderHours();
    </script>
</body>

</html>
