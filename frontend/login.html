<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - GRH System</title>
  <meta name="description" content="Connectez-vous à votre espace de gestion des employés, congés et heures de travail.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-blobs">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
  </div>

  <!-- Login Card -->
  <div class="login-wrapper">
    <div class="login-card glass-card">
      <div class="logo-area">
        <div class="logo-icon">
          <i class="bi bi-people-fill"></i>
        </div>
        <h1>GRH System</h1>
        <p>Gestion des Ressources Humaines</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-floating-custom">
          <i class="bi bi-envelope input-icon"></i>
          <input type="email" class="form-control" id="email" placeholder="Adresse email" required>
        </div>

        <div class="form-floating-custom">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" class="form-control" id="password" placeholder="Mot de passe" required>
          <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2 text-muted p-0 border-0" id="togglePassword" style="z-index:3">
            <i class="bi bi-eye"></i>
          </button>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" style="background-color: var(--bg-surface); border-color: var(--border-color);">
            <label class="form-check-label text-secondary" for="remember" style="font-size: 0.85rem;">Se souvenir de moi</label>
          </div>
          <a href="#" style="font-size: 0.85rem;">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
        </button>

        <div id="loginError" class="alert alert-danger py-2 d-none" role="alert" style="background: rgba(239,68,68,0.1); border-color: var(--danger); color: var(--danger-light); font-size: 0.85rem; border-radius: var(--radius-sm);">
          <i class="bi bi-exclamation-triangle me-1"></i> <span id="loginErrorText"></span>
        </div>
      </form>

      <div class="text-center mt-3">
        <small class="text-muted">
          Démo: <strong class="text-info">admin@grh.com</strong> / <strong class="text-info">admin</strong>
          <br>ou <strong class="text-info">employe@grh.com</strong> / <strong class="text-info">employe</strong>
        </small>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function () {
      const pw = document.getElementById('password');
      const icon = this.querySelector('i');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        pw.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    });

    // Login form handler (demo)
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('loginError');
      const errorText = document.getElementById('loginErrorText');

      // Demo credentials
      if (email === 'admin@grh.com' && password === 'admin') {
        localStorage.setItem('grh_user', JSON.stringify({ role: 'admin', name: 'Admin', email: email }));
        window.location.href = 'admin/dashboard.html';
      } else if (email === 'employe@grh.com' && password === 'employe') {
        localStorage.setItem('grh_user', JSON.stringify({ role: 'employee', name: 'Adel Selmi', email: email }));
        window.location.href = 'employee/dashboard.html';
      } else {
        errorBox.classList.remove('d-none');
        errorText.textContent = 'Email ou mot de passe incorrect.';
        errorBox.classList.add('shake');
        setTimeout(() => errorBox.classList.remove('shake'), 600);
      }
    });
  </script>
  <style>
    .shake { animation: shake 0.5s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</body>
</html>
