<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Congés - Employé | GRH System</title>
    <meta name="description" content="Consultez et soumettez vos demandes de congé.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>

<body>
    <div class="bg-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>
    <div class="sidebar-overlay"></div>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="bi bi-people-fill"></i></div>
            <div>
                <div class="brand-text">GRH System</div>
                <div class="brand-sub">Espace Employé</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Navigation</div>
            <a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2-fill"></i><span>Tableau de
                    bord</span></a>
            <a href="profile.html" class="nav-link"><i class="bi bi-person-circle"></i><span>Mon Profil</span></a>
            <a href="work-hours.html" class="nav-link"><i class="bi bi-clock-history"></i><span>Mes Heures</span></a>
            <a href="leaves.html" class="nav-link active"><i class="bi bi-calendar-check"></i><span>Mes
                    Congés</span></a>
        </nav>
        <div class="sidebar-user">
            <div class="user-avatar">AS</div>
            <div class="user-info">
                <div class="user-name">Adel Selmi</div>
                <div class="user-role">Employé</div>
            </div>
            <button onclick="logout()" class="btn btn-link text-muted p-0 ms-auto" title="Déconnexion"><i
                    class="bi bi-box-arrow-right"></i></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-navbar">
            <div class="d-flex align-items-center gap-3">
                <button class="sidebar-toggle"><i class="bi bi-list"></i></button>
                <h1 class="page-title">Mes <span>Congés</span></h1>
            </div>
        </div>

        <div class="page-content">
            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-3 col-sm-6">
                    <div class="glass-card stat-card slide-up">
                        <div class="stat-icon primary"><i class="bi bi-calendar3"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">Solde congés</div>
                            <div class="stat-value">18</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="glass-card stat-card slide-up" style="animation-delay:0.1s">
                        <div class="stat-icon success"><i class="bi bi-check-circle"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">Approuvés</div>
                            <div class="stat-value" id="myAppr">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="glass-card stat-card slide-up" style="animation-delay:0.15s">
                        <div class="stat-icon warning"><i class="bi bi-hourglass-split"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">En attente</div>
                            <div class="stat-value" id="myPend">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="glass-card stat-card slide-up" style="animation-delay:0.2s">
                        <div class="stat-icon danger"><i class="bi bi-x-circle"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">Refusés</div>
                            <div class="stat-value" id="myRej">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- New Leave Button + Table -->
            <div class="d-flex justify-content-end mb-3">
                <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#leaveModal">
                    <i class="bi bi-plus-lg me-2"></i>Nouvelle demande
                </button>
            </div>

            <div class="glass-card data-table-wrapper slide-up" style="animation-delay:0.25s">
                <div class="data-table-header">
                    <h5><i class="bi bi-list-check me-2" style="color: var(--accent);"></i>Mes demandes de congé</h5>
                </div>
                <div class="table-responsive">
                    <table class="table-dark-custom">
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Date début</th>
                                <th>Date fin</th>
                                <th>Jours</th>
                                <th>Raison</th>
                                <th>Statut</th>
                            </tr>
                        </thead>
                        <tbody id="leavesTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- New Leave Modal -->
    <div class="modal fade" id="leaveModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nouvelle demande de congé</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="leaveForm">
                        <div class="mb-3">
                            <label class="form-label text-secondary" style="font-size:0.85rem;">Type de congé</label>
                            <select class="form-select" id="leaveType" required
                                style="background:var(--bg-surface-elevated);border-color:var(--border-color);color:var(--text-primary)">
                                <option value="">Sélectionner</option>
                                <option>Annuel</option>
                                <option>Maladie</option>
                                <option>Personnel</option>
                                <option>Familial</option>
                            </select>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label text-secondary" style="font-size:0.85rem;">Date début</label>
                                <input type="date" class="form-control" id="leaveStart" required
                                    style="background:var(--bg-surface-elevated);border-color:var(--border-color);color:var(--text-primary)">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-secondary" style="font-size:0.85rem;">Date fin</label>
                                <input type="date" class="form-control" id="leaveEnd" required
                                    style="background:var(--bg-surface-elevated);border-color:var(--border-color);color:var(--text-primary)">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary" style="font-size:0.85rem;">Raison</label>
                            <textarea class="form-control" id="leaveReason" rows="3"
                                placeholder="Décrivez la raison de votre demande..."
                                style="background:var(--bg-surface-elevated);border-color:var(--border-color);color:var(--text-primary);resize:none;"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary-custom" onclick="submitLeave()">
                        <i class="bi bi-send me-1"></i>Soumettre
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const user = requireAuth('employee');
        const myId = 1;

        function renderMyLeaves() {
            const my = DemoData.leaves.filter(l => l.employeeId === myId);
            document.getElementById('myAppr').textContent = my.filter(l => l.status === 'approved').length;
            document.getElementById('myPend').textContent = my.filter(l => l.status === 'pending').length;
            document.getElementById('myRej').textContent = my.filter(l => l.status === 'rejected').length;

            document.getElementById('leavesTable').innerHTML = my.map(l => `
        <tr>
          <td>${l.type}</td>
          <td>${formatDate(l.startDate)}</td>
          <td>${formatDate(l.endDate)}</td>
          <td>${l.days}</td>
          <td><span style="font-size:0.85rem;">${l.reason}</span></td>
          <td>${getStatusBadge(l.status)}</td>
        </tr>
      `).join('') || '<tr><td colspan="6" class="text-center text-muted py-3">Aucune demande trouvée</td></tr>';
        }

        function submitLeave() {
            const type = document.getElementById('leaveType').value;
            const start = document.getElementById('leaveStart').value;
            const end = document.getElementById('leaveEnd').value;
            const reason = document.getElementById('leaveReason').value;

            if (!type || !start || !end) {
                showToast('Veuillez remplir tous les champs obligatoires.', 'error');
                return;
            }

            const startD = new Date(start);
            const endD = new Date(end);
            if (endD < startD) {
                showToast('La date de fin doit être après la date de début.', 'error');
                return;
            }

            const days = Math.ceil((endD - startD) / (1000 * 60 * 60 * 24)) + 1;
            // Exclude weekends
            let businessDays = 0;
            for (let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
                if (d.getDay() !== 0 && d.getDay() !== 6) businessDays++;
            }

            DemoData.leaves.push({
                id: DemoData.leaves.length + 10,
                employeeId: myId,
                employeeName: user.name,
                type,
                startDate: start,
                endDate: end,
                days: businessDays || days,
                reason: reason || 'Non spécifié',
                status: 'pending'
            });

            bootstrap.Modal.getInstance(document.getElementById('leaveModal')).hide();
            document.getElementById('leaveForm').reset();
            showToast('Demande de congé soumise avec succès !');
            renderMyLeaves();
        }

        renderMyLeaves();
    </script>
</body>

</html>
