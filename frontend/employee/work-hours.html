<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Heures - Employé | GRH System</title>
    <meta name="description" content="Consultez vos heures d'entrée et de sortie et pointez votre présence.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>

<body>
    <div class="bg-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>
    <div class="sidebar-overlay"></div>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="bi bi-people-fill"></i></div>
            <div>
                <div class="brand-text">GRH System</div>
                <div class="brand-sub">Espace Employé</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Navigation</div>
            <a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2-fill"></i><span>Tableau de
                    bord</span></a>
            <a href="profile.html" class="nav-link"><i class="bi bi-person-circle"></i><span>Mon Profil</span></a>
            <a href="work-hours.html" class="nav-link active"><i class="bi bi-clock-history"></i><span>Mes
                    Heures</span></a>
            <a href="leaves.html" class="nav-link"><i class="bi bi-calendar-check"></i><span>Mes Congés</span></a>
        </nav>
        <div class="sidebar-user">
            <div class="user-avatar">AS</div>
            <div class="user-info">
                <div class="user-name">Adel Selmi</div>
                <div class="user-role">Employé</div>
            </div>
            <button onclick="logout()" class="btn btn-link text-muted p-0 ms-auto" title="Déconnexion"><i
                    class="bi bi-box-arrow-right"></i></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-navbar">
            <div class="d-flex align-items-center gap-3">
                <button class="sidebar-toggle"><i class="bi bi-list"></i></button>
                <h1 class="page-title">Mes <span>Heures</span></h1>
            </div>
        </div>

        <div class="page-content">
            <!-- Clock + Stats -->
            <div class="row g-4 mb-4">
                <div class="col-lg-5">
                    <div class="glass-card slide-up">
                        <div class="clock-display">
                            <div class="time" id="bigClock">00:00:00</div>
                            <div class="date" id="bigDate"></div>
                        </div>
                        <div class="clock-actions" id="clockActions">
                            <button class="btn-clock-in" id="btnClockIn" onclick="clockIn()"><i
                                    class="bi bi-box-arrow-in-right me-2"></i>Pointer l'entrée</button>
                            <button class="btn-clock-out d-none" id="btnClockOut" onclick="clockOut()"><i
                                    class="bi bi-box-arrow-right me-2"></i>Pointer la sortie</button>
                        </div>
                        <div class="text-center mt-2 mb-3">
                            <small id="clockStatus" class="text-muted"></small>
                        </div>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="row g-4">
                        <div class="col-sm-6">
                            <div class="glass-card stat-card slide-up" style="animation-delay:0.1s">
                                <div class="stat-icon success"><i class="bi bi-clock-fill"></i></div>
                                <div class="stat-info">
                                    <div class="stat-label">Heures ce mois</div>
                                    <div class="stat-value" id="monthH">0</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="glass-card stat-card slide-up" style="animation-delay:0.15s">
                                <div class="stat-icon primary"><i class="bi bi-calendar-check"></i></div>
                                <div class="stat-info">
                                    <div class="stat-label">Jours travaillés</div>
                                    <div class="stat-value" id="daysWorked">0</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="glass-card stat-card slide-up" style="animation-delay:0.2s">
                                <div class="stat-icon info"><i class="bi bi-calculator"></i></div>
                                <div class="stat-info">
                                    <div class="stat-label">Moyenne / jour</div>
                                    <div class="stat-value" id="avgH">0</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="glass-card stat-card slide-up" style="animation-delay:0.25s">
                                <div class="stat-icon warning"><i class="bi bi-arrow-up-circle"></i></div>
                                <div class="stat-info">
                                    <div class="stat-label">Max journée</div>
                                    <div class="stat-value" id="maxH">0</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- History Table -->
            <div class="glass-card data-table-wrapper slide-up" style="animation-delay:0.3s">
                <div class="data-table-header">
                    <h5><i class="bi bi-table me-2" style="color: var(--primary-light);"></i>Historique des pointages
                    </h5>
                </div>
                <div class="table-responsive">
                    <table class="table-dark-custom">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Heure d'entrée</th>
                                <th>Heure de sortie</th>
                                <th>Heures travaillées</th>
                                <th>Statut</th>
                            </tr>
                        </thead>
                        <tbody id="hoursTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const user = requireAuth('employee');
        if (user) {
            startClock(document.getElementById('bigClock'), document.getElementById('bigDate'));

            const myId = 1;
            const myHours = DemoData.workHours.filter(w => w.employeeId === myId);
            const completed = myHours.filter(w => w.status === 'complete');

            document.getElementById('monthH').textContent = myHours.reduce((s, w) => s + (w.hours || 0), 0).toFixed(1);
            document.getElementById('daysWorked').textContent = completed.length;
            document.getElementById('avgH').textContent = completed.length ? (completed.reduce((s, w) => s + w.hours, 0) / completed.length).toFixed(1) : '0';
            document.getElementById('maxH').textContent = completed.length ? Math.max(...completed.map(w => w.hours)).toFixed(1) : '0';

            // Table
            document.getElementById('hoursTable').innerHTML = myHours.map(w => `
        <tr>
          <td>${formatDate(w.date)}</td>
          <td><span style="color:var(--success-light);font-weight:600;">${w.clockIn}</span></td>
          <td>${w.clockOut ? `<span style="color:var(--danger-light);font-weight:600;">${w.clockOut}</span>` : '<span class="text-muted">—</span>'}</td>
          <td>${w.hours ? `<span class="fw-bold">${w.hours}h</span>` : '<span class="text-muted">En cours</span>'}</td>
          <td>${getStatusBadge(w.status)}</td>
        </tr>
      `).join('');

            // Clock state
            const todayRecord = myHours.find(w => w.date === '2026-02-14');
            if (todayRecord) {
                document.getElementById('btnClockIn').classList.add('d-none');
                if (!todayRecord.clockOut) {
                    document.getElementById('btnClockOut').classList.remove('d-none');
                    document.getElementById('clockStatus').textContent = `Entrée enregistrée à ${todayRecord.clockIn}`;
                } else {
                    document.getElementById('clockStatus').innerHTML = `<span style="color:var(--success);">Journée complète — ${todayRecord.hours}h</span>`;
                }
            }
        }

        function clockIn() {
            const now = new Date();
            const time = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('btnClockIn').classList.add('d-none');
            document.getElementById('btnClockOut').classList.remove('d-none');
            document.getElementById('clockStatus').textContent = `Entrée enregistrée à ${time}`;
            showToast('Entrée enregistrée avec succès !');
        }

        function clockOut() {
            const now = new Date();
            const time = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('btnClockOut').classList.add('d-none');
            document.getElementById('clockStatus').innerHTML = `<span style="color:var(--success);">Sortie enregistrée à ${time}</span>`;
            showToast('Sortie enregistrée avec succès !');
        }
    </script>
</body>

</html>
