<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - Employé | GRH System</title>
    <meta name="description" content="Espace employé : consultez vos informations, heures et congés.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>

<body>
    <div class="bg-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>
    <div class="sidebar-overlay"></div>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="bi bi-people-fill"></i></div>
            <div>
                <div class="brand-text">GRH System</div>
                <div class="brand-sub">Espace Employé</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Navigation</div>
            <a href="dashboard.html" class="nav-link active"><i class="bi bi-grid-1x2-fill"></i><span>Tableau de
                    bord</span></a>
            <a href="profile.html" class="nav-link"><i class="bi bi-person-circle"></i><span>Mon Profil</span></a>
            <a href="work-hours.html" class="nav-link"><i class="bi bi-clock-history"></i><span>Mes Heures</span></a>
            <a href="leaves.html" class="nav-link"><i class="bi bi-calendar-check"></i><span>Mes Congés</span></a>
        </nav>
        <div class="sidebar-user">
            <div class="user-avatar" id="userInitials">AS</div>
            <div class="user-info">
                <div class="user-name" id="userName">Adel Selmi</div>
                <div class="user-role">Employé</div>
            </div>
            <button onclick="logout()" class="btn btn-link text-muted p-0 ms-auto" title="Déconnexion"><i
                    class="bi bi-box-arrow-right"></i></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-navbar">
            <div class="d-flex align-items-center gap-3">
                <button class="sidebar-toggle"><i class="bi bi-list"></i></button>
                <h1 class="page-title">Mon <span>Espace</span></h1>
            </div>
            <div class="navbar-actions">
                <button class="btn-icon" title="Notifications"><i class="bi bi-bell"></i><span
                        class="badge-dot"></span></button>
            </div>
        </div>

        <div class="page-content">
            <!-- Welcome -->
            <div class="glass-card p-4 mb-4 slide-up">
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                    <div>
                        <h4 class="fw-bold mb-1">Bonjour, <span id="welcomeName">Adel</span> 👋</h4>
                        <p class="text-secondary mb-0">Bienvenue dans votre espace personnel.</p>
                    </div>
                    <div class="text-end">
                        <div class="fw-semibold" style="color: var(--accent);" id="empDate"></div>
                        <small class="text-muted" id="empTime"></small>
                    </div>
                </div>
            </div>

            <!-- Quick Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="glass-card stat-card slide-up" style="animation-delay:0.1s">
                        <div class="stat-icon success"><i class="bi bi-clock-fill"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">Heures ce mois</div>
                            <div class="stat-value" id="myHours">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card stat-card slide-up" style="animation-delay:0.15s">
                        <div class="stat-icon warning"><i class="bi bi-calendar-check"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">Congés restants</div>
                            <div class="stat-value">18</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card stat-card slide-up" style="animation-delay:0.2s">
                        <div class="stat-icon primary"><i class="bi bi-hourglass-split"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">Demandes en cours</div>
                            <div class="stat-value" id="myPending">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Clock + Recent -->
            <div class="row g-4">
                <div class="col-lg-5">
                    <div class="glass-card slide-up" style="animation-delay:0.25s">
                        <div class="clock-display">
                            <div class="time" id="bigClock">00:00:00</div>
                            <div class="date" id="bigDate"></div>
                        </div>
                        <div class="clock-actions" id="clockActions">
                            <button class="btn-clock-in" id="btnClockIn" onclick="clockIn()"><i
                                    class="bi bi-box-arrow-in-right me-2"></i>Pointer l'entrée</button>
                            <button class="btn-clock-out d-none" id="btnClockOut" onclick="clockOut()"><i
                                    class="bi bi-box-arrow-right me-2"></i>Pointer la sortie</button>
                        </div>
                        <div class="text-center mt-2 mb-3">
                            <small id="clockStatus" class="text-muted"></small>
                        </div>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="glass-card data-table-wrapper slide-up" style="animation-delay:0.3s">
                        <div class="data-table-header">
                            <h5><i class="bi bi-calendar-check me-2" style="color:var(--accent);"></i>Mes derniers
                                congés</h5>
                            <a href="leaves.html" class="btn btn-outline-custom btn-sm">Voir tout</a>
                        </div>
                        <div class="table-responsive">
                            <table class="table-dark-custom">
                                <thead>
                                    <tr>
                                        <th>Type</th>
                                        <th>Période</th>
                                        <th>Jours</th>
                                        <th>Statut</th>
                                    </tr>
                                </thead>
                                <tbody id="myLeaves"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const user = requireAuth('employee');
        if (user) {
            document.getElementById('welcomeName').textContent = user.name.split(' ')[0];
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userInitials').textContent = getInitials(user.name);

            startClock(document.getElementById('empTime'), document.getElementById('empDate'));
            startClock(document.getElementById('bigClock'), document.getElementById('bigDate'));

            // My data (simulate employee id 1)
            const myId = 1;
            const myHours = DemoData.workHours.filter(w => w.employeeId === myId).reduce((s, w) => s + (w.hours || 0), 0);
            document.getElementById('myHours').textContent = myHours.toFixed(1);
            document.getElementById('myPending').textContent = DemoData.leaves.filter(l => l.employeeId === myId && l.status === 'pending').length;

            // My Leaves
            const myLeaves = DemoData.leaves.filter(l => l.employeeId === myId);
            document.getElementById('myLeaves').innerHTML = myLeaves.map(l => `
        <tr>
          <td>${l.type}</td>
          <td>${formatDate(l.startDate)} - ${formatDate(l.endDate)}</td>
          <td>${l.days}</td>
          <td>${getStatusBadge(l.status)}</td>
        </tr>
      `).join('') || '<tr><td colspan="4" class="text-center text-muted py-3">Aucun congé trouvé</td></tr>';

            // Clock In/Out (check today's record)
            const todayRecord = DemoData.workHours.find(w => w.employeeId === myId && w.date === '2026-02-14');
            if (todayRecord) {
                document.getElementById('btnClockIn').classList.add('d-none');
                if (!todayRecord.clockOut) {
                    document.getElementById('btnClockOut').classList.remove('d-none');
                    document.getElementById('clockStatus').textContent = `Entrée enregistrée à ${todayRecord.clockIn}`;
                } else {
                    document.getElementById('clockStatus').innerHTML = `<span style="color:var(--success);">Journée complète — ${todayRecord.hours}h travaillées</span>`;
                }
            }
        }

        function clockIn() {
            const now = new Date();
            const time = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('btnClockIn').classList.add('d-none');
            document.getElementById('btnClockOut').classList.remove('d-none');
            document.getElementById('clockStatus').textContent = `Entrée enregistrée à ${time}`;
            showToast('Entrée enregistrée avec succès !');
        }

        function clockOut() {
            const now = new Date();
            const time = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('btnClockOut').classList.add('d-none');
            document.getElementById('clockStatus').innerHTML = `<span style="color:var(--success);">Sortie enregistrée à ${time}</span>`;
            showToast('Sortie enregistrée avec succès !');
        }
    </script>
</body>

</html>
